<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier North — Cinematic Intro</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010204}
body{font-family:Arial,Helvetica,sans-serif;color:#fff}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden;perspective:1800px;background:#010204}
.bg{position:absolute;inset:-10%;background:
radial-gradient(circle at 50% 47%,rgba(255,214,158,.20),transparent 19%),
radial-gradient(circle at 22% 36%,rgba(71,145,190,.12),transparent 27%),
radial-gradient(circle at 78% 64%,rgba(194,137,80,.12),transparent 28%),#010204}
.bg:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 28%,rgba(0,0,0,.88) 100%)}
.floor{position:absolute;left:-10%;right:-10%;bottom:-12%;height:43%;transform:rotateX(67deg);transform-origin:bottom;
background:linear-gradient(90deg,transparent,rgba(255,209,145,.12),transparent),repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 90px);
box-shadow:0 -20px 100px rgba(255,196,112,.08)}
.orbit{position:absolute;left:50%;top:50%;width:min(82vw,1250px);height:min(50vw,760px);transform:translate(-50%,-50%) rotateX(67deg);
border:1px solid rgba(255,218,171,.32);border-radius:50%;box-shadow:0 0 55px rgba(255,190,115,.11);animation:orbit 20s linear infinite}
@keyframes orbit{to{transform:translate(-50%,-50%) rotateX(67deg) rotateZ(360deg)}}

.card{position:absolute;left:50%;top:50%;width:clamp(145px,14vw,225px);aspect-ratio:16/10;border-radius:14px;overflow:hidden;
border:1px solid rgba(255,255,255,.28);background:#101418;box-shadow:0 24px 70px rgba(0,0,0,.72),0 0 32px rgba(255,210,160,.08);
opacity:0;transform-style:preserve-3d;backface-visibility:hidden;animation:fly 4.8s cubic-bezier(.16,1,.3,1) forwards}
.card img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.84) saturate(.82)}
.card:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.22),transparent 32%,rgba(0,0,0,.42))}
.c1{--x:-45vw;--y:-34vh;--r:-23deg;animation-delay:.15s}.c2{--x:34vw;--y:-35vh;--r:20deg;animation-delay:.35s}
.c3{--x:-43vw;--y:24vh;--r:18deg;animation-delay:.55s}.c4{--x:39vw;--y:25vh;--r:-19deg;animation-delay:.75s}
.c5{--x:-12vw;--y:-39vh;--r:8deg;animation-delay:.95s}.c6{--x:14vw;--y:37vh;--r:-8deg;animation-delay:1.15s}
.c7{--x:-49vw;--y:-5vh;--r:-32deg;animation-delay:1.35s}.c8{--x:49vw;--y:2vh;--r:31deg;animation-delay:1.55s}
.c9{--x:-5vw;--y:44vh;--r:15deg;animation-delay:1.75s}.c10{--x:5vw;--y:-46vh;--r:-12deg;animation-delay:1.95s}

@keyframes fly{
0%{opacity:0;transform:translate3d(-50%,-50%,1100px) rotateY(135deg) rotateX(42deg) rotateZ(0) scale(.04)}
24%{opacity:1}
55%{transform:translate3d(calc(-50% + var(--x)*.72),calc(-50% + var(--y)*.72),260px) rotateY(25deg) rotateX(12deg) rotateZ(calc(var(--r)*1.5)) scale(1.02)}
100%{opacity:1;transform:translate3d(calc(-50% + var(--x)),calc(-50% + var(--y)),0) rotateY(0) rotateX(0) rotateZ(var(--r)) scale(1)}
}

.core{position:absolute;left:50%;top:50%;width:190px;height:190px;transform:translate(-50%,-50%);display:grid;place-items:center;
opacity:0;animation:coreIn 1.6s 5s cubic-bezier(.16,1,.3,1) forwards}
.core:before{content:"";position:absolute;width:155px;height:155px;border-radius:50%;
background:radial-gradient(circle,rgba(255,239,206,.40),rgba(255,196,108,.10) 42%,transparent 70%);
filter:blur(10px);animation:pulse 2.5s ease-in-out infinite}
.core:after{content:"";position:absolute;width:92px;height:92px;border:1px solid rgba(255,237,204,.85);
box-shadow:0 0 30px rgba(255,218,165,.75),inset 0 0 28px rgba(255,218,165,.25);transform:rotate(45deg)}
.core .a{position:relative;z-index:2;font-size:155px;font-weight:200;letter-spacing:-26px;line-height:1;transform:translateX(-7px);
background:linear-gradient(135deg,#ffffff 0%,#fff8e9 32%,#ffd58e 55%,#ffffff 82%,#fff);-webkit-background-clip:text;color:transparent;
filter:drop-shadow(0 0 7px #fff) drop-shadow(0 0 22px rgba(255,216,151,.95)) drop-shadow(0 0 48px rgba(255,185,92,.7))}
@keyframes coreIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(-18deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(1.08) rotate(2deg)}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}}
@keyframes pulse{50%{transform:scale(1.16);opacity:.8}}

.title{position:absolute;left:50%;top:58%;transform:translate(-50%,34px);text-align:center;opacity:0;white-space:nowrap;
animation:titleIn 1.7s 5.85s cubic-bezier(.16,1,.3,1) forwards}
.title h1{margin:0;font-size:clamp(34px,5vw,78px);font-weight:300;letter-spacing:.34em;padding-left:.34em;text-shadow:0 0 28px rgba(255,220,175,.32)}
.title p{margin:22px 0 0;font-size:clamp(10px,1.05vw,15px);letter-spacing:.48em;padding-left:.48em;color:rgba(255,246,232,.74)}
@keyframes titleIn{to{opacity:1;transform:translate(-50%,0)}}
.skip{position:absolute;right:24px;bottom:22px;padding:10px 15px;border:1px solid rgba(255,255,255,.22);border-radius:999px;
font-size:11px;letter-spacing:.12em;color:rgba(255,255,255,.62);background:rgba(255,255,255,.04);cursor:pointer;z-index:10}
@media(max-width:700px){.card{width:130px}.title{top:61%}.orbit{width:115vw}.c7,.c8{display:none}}
/* Module transition */
#pageTransition{
    position:fixed;
    inset:0;
    background:#010204;
    z-index:9999;
    opacity:0;
    pointer-events:none;
    transition:opacity 1.2s cubic-bezier(.16,1,.3,1);
}

#pageTransition.active{
    opacity:1;
    pointer-events:auto;
}
/* Cinematic light-flash transition */
#lightFlash{
    position:fixed;
    inset:0;
    z-index:9999;
    pointer-events:none;
    opacity:0;
    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(255,255,255,1) 0%,
            rgba(255,244,220,.98) 18%,
            rgba(255,218,160,.75) 38%,
            rgba(255,190,110,.28) 62%,
            transparent 82%
        );
    transform:scale(.15);
}

#lightFlash.active{
    animation:cinematicFlash 1.15s cubic-bezier(.16,1,.3,1) forwards;
}

@keyframes cinematicFlash{

    0%{
        opacity:0;
        transform:scale(.15);
    }

    18%{
        opacity:.9;
        transform:scale(.65);
    }

    42%{
        opacity:1;
        transform:scale(1.35);
    }

    62%{
        opacity:1;
        transform:scale(2.4);
    }

    100%{
        opacity:1;
        transform:scale(5);
    }
}
</style>
</head>
<body>
<div id="lightFlash"></div>
<div id="stage">
<div class="bg"></div><div class="floor"></div><div class="orbit"></div>
<div class="card c1"><img src="https://images.unsplash.com/photo-1575052814086-f385e2e2ad1b?auto=format&fit=crop&fm=jpg&q=85&w=1200" alt="Atelier North visual 1"></div><div class="card c2"><img src="https://images.unsplash.com/photo-1764426445444-5a528029fd62?auto=format&fit=crop&fm=jpg&q=85&w=1200" alt="Atelier North visual 2"></div>
<div class="card c3"><img src="https://images.unsplash.com/photo-1494396929455-70c3a2007618?auto=format&fit=crop&fm=jpg&q=85&w=1200" alt="Atelier North visual 3"></div><div class="card c4"><img src="https://images.unsplash.com/photo-1775338791133-c738fdc56976?auto=format&fit=crop&fm=jpg&q=85&w=1200" alt="Atelier North visual 4"></div>
<div class="card c5"><img src="https://images.unsplash.com/photo-1758686253953-119e0c3bd3d6?auto=format&fit=crop&fm=jpg&q=85&w=1200" alt="Atelier North visual 5"></div><div class="card c6"><img src="https://images.unsplash.com/photo-1770703674640-1693ed0e5d4e?auto=format&fit=crop&fm=jpg&q=85&w=1200" alt="Atelier North visual 6"></div>
<div class="card c7"><img src="https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&fm=jpg&q=85&w=1200" alt="Atelier North visual 7"></div><div class="card c8"><img src="https://images.unsplash.com/photo-1509576931792-214960705f8a?auto=format&fit=crop&fm=jpg&q=85&w=1200" alt="Atelier North visual 8"></div>
<div class="card c9"><img src="https://images.unsplash.com/photo-1767958465025-75c050ab10c4?auto=format&fit=crop&fm=jpg&q=85&w=1200" alt="Atelier North visual 9"></div><div class="card c10"><img src="https://images.unsplash.com/photo-1434494878577-86c23bcb06b9?auto=format&fit=crop&fm=jpg&q=85&w=1200" alt="Atelier North visual 10"></div>
<div class="core"><div class="a">A</div></div>
<div class="title"><h1>ATELIER NORTH</h1><p>HUMAN EXPERIENCES · INTELLIGENT TECHNOLOGY</p></div>
<button class="skip" onclick="finish()">SKIP INTRO</button>
</div>
<script>
let introFinished = false;
let redirectTimer;

/* Complete Module 1 and move to Module 2 */
function finish() {

    if (introFinished) return;
    introFinished = true;

    /* Stop the flying cards */
    document.querySelectorAll('.card').forEach(card => {
        card.style.animation = 'none';
    });

    /* Bring in the Atelier North mark */
    document.querySelector('.core').style.animation =
        'coreIn .8s forwards';

    /* Bring in the title */
    document.querySelector('.title').style.animation =
        'titleIn .8s forwards';

    /*
      Give the final reveal a moment to appear,
      then automatically open Module 2.
    */
   redirectTimer = setTimeout(() => {

    const flash = document.getElementById('lightFlash');

    flash.classList.add('active');

    setTimeout(() => {

        window.location.href = "../module-02/index.html";

    }, 650);

}, 850);
}


/*
  AUTOMATIC INTRO FLOW

  Cards finish around 4.8s
  Core begins at 5s
  Title begins at 5.85s
  Title animation finishes around 7.55s

  We wait slightly longer so the complete
  cinematic reveal is visible before moving on.
*/
setTimeout(() => {
    finish();
}, 7900);
</script>
</body>
</html>
